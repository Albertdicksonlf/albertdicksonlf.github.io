name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  # Todo dia às 00h30 de Natal (03h30 UTC): busca as notas novas do vault e republica.
  schedule:
    - cron: "30 3 * * *"
  # Permite rodar à mão pela aba Actions ("Run workflow").
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Só busca o vault se a chave de leitura estiver cadastrada nos Secrets do repositório.
      HAS_VAULT_KEY: ${{ secrets.VAULT_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Buscar o vault (medicina-vault)
        if: env.HAS_VAULT_KEY == 'true'
        uses: actions/checkout@v6
        with:
          repository: Albertdicksonlf/medicina-vault
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: .vault
          fetch-depth: 1
      - name: Copiar o Atlas Clínico atualizado para o site
        if: env.HAS_VAULT_KEY == 'true'
        run: |
          shopt -s nullglob
          src=(.vault/1\ -\ Atlas*)
          if [ ${#src[@]} -ne 1 ]; then
            echo "Pasta do Atlas não encontrada no vault; publicando com o conteúdo do repositório."
            exit 0
          fi
          rm -rf content/1\ -\ Atlas* content/3\ -\ Fonte*
          cp -R "${src[0]}" content/
          rm -rf .vault
          echo "Notas do Atlas: $(find content -name '*.md' | wc -l)"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Ajuste de desempenho da busca
        run: node scripts/patch-search.mjs
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
